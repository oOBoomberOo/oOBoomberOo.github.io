---
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f3eee4">
  {% if page.url == "/" %}
  <title>Boomber</title>
  {% else %}
  <title>{{ page.title }} · Boomber</title>
  {% endif %}
  {% if page.description %}
  <meta name="description" content="{{ page.description }}">
  {% endif %}
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <div class="wrap">
    <header class="site-header">
      <p class="site-name"><a href="{{ '/' | relative_url }}">Boomber</a></p>
      <nav aria-label="Site">
        <a href="{{ '/' | relative_url }}"{% if page.url == "/" %} aria-current="page"{% endif %}>Home</a>
        <a href="{{ '/mods/' | relative_url }}"{% if page.url contains "/mods/" %} aria-current="page"{% endif %}>Mods</a>
        <a href="{{ '/projects/' | relative_url }}"{% if page.url contains "/projects/" %} aria-current="page"{% endif %}>Projects</a>
      </nav>
    </header>
    <main id="content" tabindex="-1">
      {{ content }}
    </main>
    <footer class="site-footer">
      <p class="mark">Boomber</p>
      <p><a href="mailto:contact@boomber.xyz">contact@boomber.xyz</a></p>
    </footer>
  </div>
</body>
</html>
