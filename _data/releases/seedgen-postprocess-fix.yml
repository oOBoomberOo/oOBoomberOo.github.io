# Newest release first. To publish another one, add an entry above this list.
# A release can include several jars. Put each one under files.
# download is a site path such as /files/seedgen-postprocess-fix/name.jar, or a full URL.
# sha256 is that file's hex digest. file_size is the size in bytes. date is YYYY-MM-DD.
# Leave a download empty only when that jar is not ready. Do not invent checksums or sizes.
- version: "1.0.0"
  date: "2026-11-09"
  note: The Fabric jar is tested in-game; the NeoForge jar is compile-tested only. Add -Dseedgenfix.skipFeaturePainting=false to restore SeedGen's original ground-feature painting.
  changelog:
    - Stop Distant Horizons SeedGen from writing the unsupported post-processing warning for every block it paints.
    - Skip SeedGen's expensive ground-feature painting, so LOD generation stays fast with modded worldgen like WWOO while trees still render.
    - Leave every other log message untouched.
  files:
    - minecraft: "1.20.1 - 26.3"
      loader: Fabric
      download: /files/seedgen-postprocess-fix/seedgen-postprocess-fix-fabric-1.0.0.jar
      file_size: 5487
      sha256: 5472d1126de7549ee88bbe59ec01392a29fc8f9e95f4c5b50c897b34e66fd758
      requirements:
        - Distant Horizons
        - SeedGen
        - Fabric Loader 0.15.0 or newer
        - Java 17 or newer
    - minecraft: "1.20.1 - 26.3"
      loader: NeoForge
      download: /files/seedgen-postprocess-fix/seedgen-postprocess-fix-neoforge-1.0.0.jar
      file_size: 5796
      sha256: 8c4d51ea7cb9ef9b42fb2fbb1e0a1a12a0cea3685eb4f13f24785c8effc4756e
      requirements:
        - Distant Horizons
        - SeedGen
        - NeoForge 47.1 or newer
        - Java 17 or newer
