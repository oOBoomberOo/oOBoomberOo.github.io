# Newest release first. To publish another one, add an entry above this list.
# A release can include several jars. Put each one under files.
# download is a site path such as /files/seamless-dimensions/name.jar, or a full URL.
# sha256 is that file's hex digest. file_size is the size in bytes. date is YYYY-MM-DD.
# Leave a download empty only when that jar is not ready. Do not invent checksums or sizes.
- version: "1.0.0"
  date: "2026-10-17"
  note: Not tested with Sodium or Iris yet.
  changelog:
    - Remove loading screen when going through the Nether and End Portal.
    - Preload dimension when player is near a portal, allowing much faster dimension switch.
